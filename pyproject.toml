[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "account-intelligence-engine"
version = "0.1.0"
description = "Turn recurring operational data into a persistent, independently validated account picture and a CSM-ready action list."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Peter Inglehart" }]
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
aie = "aie.cli:main"
aie-integrity = "aie_integrity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aie.packs" = ["*/pack.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
